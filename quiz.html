<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compatibility Test 🧪</title><link rel="stylesheet" href="style.css"></head><body><nav><a class="logo" href="index.html">Mission: <span class="pink">Dinesh ❤️ Ujwala</span></a><a class="btn small secondary" href="index.html">🏠 Home</a></nav><main class="page"><div class="quiz"><h2>Very Serious Compatibility Test 🧪</h2><p class="lead">This study has absolutely no scientific credibility.</p><div class="barbg"><div id="bar" class="bar"></div></div><div id="q"></div><div id="opts" class="options"></div><button id="next" class="btn">Next Question →</button><div id="feedback" class="feedback"></div></div></main><footer>Made with ❤️ by your future date 😎</footer><script>var qs=[{q:"What belongs on a perfect date?",a:["🍕 Food","😂 Laughing","💑 You + Me","💖 All of these"],c:3},{q:"If I say “I'm not hungry”?",a:["I am hungry","I want your food","I need snacks","😌 All three"],c:3},{q:"Who is the cutest person here?",a:["Me 😎","You 😍","Both of us","The person reading this 👀"],c:1}],i=0,ch=-1,score=0;function render(){ch=-1;var x=qs[i];bar.style.width=i/qs.length*100+"%";q.innerHTML="<div class=question>Q"+(i+1)+". "+x.q+"</div>";opts.innerHTML="";x.a.forEach(function(t,n){var b=document.createElement("button");b.className="option";b.textContent=t;b.onclick=function(){ch=n;document.querySelectorAll(".option").forEach(function(z){z.classList.remove("active")});b.classList.add("active")};opts.appendChild(b)})}next.onclick=function(){if(ch<0){feedback.textContent="Choose an answer first, genius 😌";return}if(ch===qs[i].c)score++;i++;if(i<qs.length)render();else{bar.style.width="100%";q.innerHTML="<div class=question>Test complete! 🧪</div><p class=lead>Score: "+score+"/"+qs.length+"</p>";opts.innerHTML="";next.textContent="Unlock the secret date 🔐";next.onclick=function(){location.href="date.html"};feedback.textContent=score===3?"Perfect! The universe wants this date. 😂💖":"Further research is required... preferably over dinner. 😌"}};render();</script></body></html>
